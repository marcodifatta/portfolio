# Postgres condiviso per i progetti sul server.
# Un database e un utente per ogni progetto (scripts/new-project-db.sh).
# Sul server vive in ~/infra/postgres, indipendente dai progetti.
services:
  postgres:
    image: postgres:17-alpine
    container_name: pg-shared
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?imposta POSTGRES_SUPERUSER_PASSWORD nel file .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: Europe/Rome
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - log_connections=off
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # Raggiungibile solo dal server stesso (tunnel SSH da TablePlus/DBeaver).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - db-net
    mem_limit: 256m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
    name: pg_shared_data

networks:
  # Le app si collegano a questa rete come "external" e usano l'host pg-shared.
  db-net:
    name: db-net
