# Regole di accesso del Postgres condiviso.
# Socket locale (solo con `docker exec`, che richiede già i permessi di Docker): senza password,
# serve agli script di amministrazione. Ogni connessione di rete richiede la password.
# TYPE  DATABASE  USER  ADDRESS     METHOD
local   all       all               trust
host    all       all   0.0.0.0/0   scram-sha-256
host    all       all   ::/0        scram-sha-256
