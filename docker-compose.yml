# Portfolio su mdfdev.xyz. Deploy: git pull && docker compose up -d --build
# Prima di tutto serve lo stack del Postgres condiviso (infra/postgres) e il file .env (vedi .env.example).
services:
  portfolio:
    build: .
    image: mdf-portfolio
    container_name: portfolio
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
      PORT: "3000"
    volumes:
      - portfolio_uploads:/data/uploads
    # Nginx Proxy Manager inoltra mdfdev.xyz a <IP del server>:8080. La porta non è raggiungibile da
    # internet: il firewall Hetzner lascia passare solo 22, 80 e 443.
    ports:
      - "8080:3000"
    networks:
      - proxy
      - db-net
    stop_grace_period: 15s

networks:
  proxy:
    name: portainer_marco-network
    external: true
  db-net:
    external: true

volumes:
  portfolio_uploads:
    name: portfolio_uploads
